name: shirobakobot

services:
  bot:
    image: shirobakobot:local
    build:
      context: .
      dockerfile: Dockerfile.deploy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
